name: Pruebas inventario
on:
  push:
    branches: [Inventario]
  pull_request:
    branches: [Inventario, main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Ejecutar pruebas
        run: mvn -B clean test
